# ==============================================================================
# Frontend React SPA Nginx Configuration (portal/nginx.conf)
# Domain: portal.mantisplacements.com.au
# Server Path: /var/www/placement-portal/portal/dist
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name portal.mantisplacements.com.au mantisplacements.com.au www.mantisplacements.com.au;

    root /var/www/placement-portal/portal/dist;
    index index.html index.htm;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_header Set-Cookie;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/placement-portal/portal/dist;
    }
}
